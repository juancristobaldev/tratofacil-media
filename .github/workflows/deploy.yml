name: Deploy Cloudflare Images (Pre-built Build)

on:
  push:
    branches:
      - main
      - staging

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
      owner: ${{ steps.vars.outputs.owner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set Image Tag
        id: vars
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          else
            echo "tag=staging" >> "$GITHUB_OUTPUT"
          fi
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/${{ steps.vars.outputs.owner }}/tratofacil-cloudflare-images:${{ steps.vars.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-vps:
    name: Deploy to VPS
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Execute Remote SSH Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            TAG="${{ needs.build-and-push.outputs.tag }}"
            
            if [ "$TAG" = "latest" ]; then
              echo "🚀 Desplegando Media en PRODUCCIÓN..."
              cd /root/tratofacil
              docker compose -p tratofacil -f docker-compose.yml pull cloudflare-images
              docker compose -p tratofacil -f docker-compose.yml up -d --no-deps cloudflare-images
              docker image prune -f
            else
              echo "🧪 Desplegando Media en STAGING..."
              cd /root/tratofacil
              docker compose -p tratofacil-staging -f docker-compose.staging.yml pull cloudflare-images
              if docker compose -p tratofacil-staging -f docker-compose.staging.yml ps -q cloudflare-images | grep -q .; then
                docker compose -p tratofacil-staging -f docker-compose.staging.yml up -d --no-deps cloudflare-images
              fi
              docker image prune -f
            fi