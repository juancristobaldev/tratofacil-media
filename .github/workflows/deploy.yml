name: Deploy Cloudflare Images

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Executing remote SSH commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /root/tratofacil/cloudflare-images
            git fetch --all
            git reset --hard origin/main

            cd /root/tratofacil

            docker compose build cloudflare-images

            docker compose up -d --no-deps cloudflare-images

            docker image prune -f
